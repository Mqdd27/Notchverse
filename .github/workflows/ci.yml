name: CI
on: [push, pull_request, workflow_dispatch] # Run workflow by hand = release
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      # Actions › CI › Run workflow: build the DMG and publish v0.1.<run number>.
      - name: Release
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="0.1.${{ github.run_number }}"
          VERSION=$VERSION scripts/build-app.sh --dmg
          gh release create "v$VERSION" ".build/Notchverse-$VERSION.dmg" --target "$GITHUB_SHA" --title "Notchverse $VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test
