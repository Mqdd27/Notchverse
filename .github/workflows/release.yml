name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh --dmg
      - run: gh release create "$GITHUB_REF_NAME" .build/Notchverse-*.dmg --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
