name: Release
# Every code change pushed to main becomes a release: v0.1.<run number>, with the DMG attached.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", "packaging/**", ".github/workflows/ci.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: echo "VERSION=0.1.${{ github.run_number }}" >> "$GITHUB_ENV"
      - run: scripts/build-app.sh --dmg
      - run: gh release create "v$VERSION" ".build/Notchverse-$VERSION.dmg" --target "$GITHUB_SHA" --title "Notchverse $VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
